<!DOCTYPE html>
<html lang="en">
<head>
  <!-- (a) Head section with SEO -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LCMS – Rwanda Coding Academy</title>
  <meta name="description" content="Learning Content Management System built with Bootstrap 5 for Rwanda Coding Academy.">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- (b) Bootstrap layout -->
  <div class="container-fluid">
    <div class="row g-3">
      <!-- Sidebar -->
      <aside class="col-lg-3 col-12 bg-dark text-white p-4">
        <h4 class="mb-3">Sidebar</h4>
        <ul class="nav flex-column">
          <li class="nav-item"><a class="nav-link text-white" href="#">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="#">Courses</a></li>
          <li class="nav-item"><a class="nav-link text-white" href="#">Students</a></li>
        </ul>
      </aside>

      <!-- Main Content -->
      <main class="col-lg-9 col-12 p-4">
        <div class="card shadow">
          <div class="card-body">
            <h2 class="card-title">Main Content</h2>
            <p class="card-text">Welcome to the LCMS dashboard. Manage courses and students here.</p>
            <button class="btn btn-primary">Get Started</button>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- (c) Web ergonomics principles -->
  <!-- 
    1. Consistency – same colors and layout across pages.
    2. Accessibility – high contrast, readable fonts, alt text for images.
    3. Feedback – hover effects on links, buttons highlight when clicked.
  -->

  <!-- (d) Deployment commands (Linux - Apache) -->
  <!-- 
    sudo mv ~/lcms_project /var/www/html/
    sudo chown -R www-data:www-data /var/www/html/lcms_project
    sudo chmod -R 755 /var/www/html/lcms_project
    sudo systemctl restart apache2
  -->

  <!-- (d) Deployment note (Windows - XAMPP) -->
  <!-- 
    1. Copy project folder to C:\xampp\htdocs\
    2. Start Apache in XAMPP Control Panel
    3. Access via http://localhost/lcms_project
  -->

  <!-- Browser Output Explanation:
    The LCMS layout displays a dark sidebar with navigation links and a main content card.
    It is responsive and adjusts for mobile screens.
    This demonstrates Bootstrap grid usage, styling, and web ergonomics principles.
  -->

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
